name: 每日热榜存档

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行抓取脚本
        run: python3 scripts/archive.py

      - name: 提交并推送
        run: |
          git config user.name "hotlist-bot"
          git config user.email "bot@hotlist.archive"
          git add data/ latest/
          if git diff --cached --quiet; then
            echo "📭 无新数据，跳过提交"
          else
            git commit -m "📦 存档 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
            echo "✅ 推送成功"
          fi