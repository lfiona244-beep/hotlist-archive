name: 在线源每日巡检

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 追剧资源存档
        run: python3 scripts/zhuiju_archive.py

      - name: 在线源健康巡检
        run: python3 scripts/source_health.py

      - name: 提交并推送
        run: |
          git config user.name "hotlist-bot"
          git config user.email "bot@hotlist.archive"
          git add data/ latest/
          if git diff --cached --quiet; then
            echo "📭 无新数据，跳过提交"
          else
            git commit -m "🧪 在线源巡检 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
            echo "✅ 推送成功"
          fi